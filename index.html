<!DOCTYPE html>
<html>
<head>
  <title>Cytoscape Application</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.23.0/cytoscape.min.js"></script>
</head>
<body>
  <div id="cy"></div>
  <div id="controls">
    <button id="load-data-btn">Load Sample Data</button>
    <button id="betweenness-btn">Calculate Betweenness Centrality</button>
    <button id="cluster-btn">Identify Clusters (Sample)</button>
    <button id="rank-btn">Rank by Betweenness</button>

    <div class="csv-upload-section">
      <p class="csv-instructions">
        <strong>CSV Format:</strong><br>
        Nodes CSV: Must have an 'ip_address' column (will be used as node ID).<br>
        Edges CSV: Must have 'fm_ip' (source IP) and 'to_ip' (target IP) columns.
      </p>
      <div>
        <label for="nodes-file-input">Nodes CSV:</label>
        <input type="file" id="nodes-file-input" accept=".csv">
      </div>
      <div>
        <label for="edges-file-input">Edges CSV:</label>
        <input type="file" id="edges-file-input" accept=".csv">
      </div>
      <button id="load-csv-btn">Load Data from CSVs</button>
    </div>
  </div>
  <div id="status-message"></div>
  <script src="script.js" defer></script>
</body>
</html>
